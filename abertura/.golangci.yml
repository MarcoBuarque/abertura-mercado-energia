version: "2"
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - bodyclose
    - nilerr
    - gochecknoglobals
    - revive
    - misspell
  settings:
    errcheck:
      check-type-assertions: true
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: receiver-naming
        - name: package-comments
        - name: error-naming
        - name: redundant-import-alias
  exclusions:
    rules:
      - path: _test\.go
        linters: [gochecknoglobals]
