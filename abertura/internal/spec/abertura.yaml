openapi: 3.0.3
info:
  title: Market Opening API (unofficial description)
  version: 0.2.0
  description: |
    Unofficial, hand-written description of part of the retail APIs of the Brazilian
    energy market opening. This project is independent: it is not affiliated with,
    sponsored or endorsed by the Câmara de Comercialização de Energia Elétrica
    (CCEE), and nothing here replaces the operator's documentation.

    The spec describes what the API actually returns, according to tests in the
    sandbox environment, and not only what the public documentation says. Every
    operation carries `x-confidence` (`high`, `medium` or `low`) and, when `high`,
    `x-verified-at` with the date of the last check. The divergences between the
    documentation and what was observed are in `SOURCES.md`, numbered D1 to D23 and
    cited in `x-divergences`.

    All examples are invented: consumer units (UC) with leading zeros, agent,
    profile and distributor codes in the 900000 range, documents with repeated
    digits and e-mails at `example.org`.
  contact:
    name: abertura-mercado-energia project
    url: https://github.com/MarcoBuarque/abertura-mercado-energia
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  x-source:
    collection: https://documenter.getpostman.com/view/30322966/2sAXqqchhJ
    extracted-at: "2026-10-30T10:52:36-03:00"
    sandbox-tested-at: "2026-10-30T11:56:47-03:00"
externalDocs:
  description: Documentation site, with the error catalog and client guides.
  url: https://marcobuarque.github.io/abertura-mercado-energia/
servers:
  - url: https://sandbox-api-abm.ccee.org.br
    description: Sandbox, with fictitious agents.
  - url: http://localhost:4010
    description: Local mock (Prism) serving the examples of this spec.
  - url: https://api-abm.ccee.org.br
    description: Production.
security:
  - oauth2: []
tags:
  - name: Authentication
    x-displayName: Authentication
    description: Issuing the access token.
  - name: Migrations
    x-displayName: Migrations
    description: Migrations of consumer units to the free market, retailer side.
  - name: Measurements
    x-displayName: Measurements
    description: Consumption measurements of the consumer units.
  - name: Change requests
    x-displayName: Change requests
    description: Change requests (change of representative, supply suspension, return to the captive market).
paths:
  /sso/oauth/token:
    post:
      operationId: getToken
      tags: [Authentication]
      summary: Gets the access token
      description: |
        Exchanges the client credentials for an access token (the
        `client_credentials` flow). Send only `client_id` and `client_secret`: the
        form with `grant_type` was rejected with 400 on 2026-11-01. The token is valid
        for about five minutes and there is no refresh token: request another one
        before it expires. The body of this route's 400 is an OAuth2 error object,
        not the `Error` of the other routes.
      security: []
      x-confidence: high
      x-verified-at: "2026-11-01"
      x-source: Collection, Authentication section; sandbox tests on 2026-10-30 and 2026-11-01.
      x-divergences: [15, 17]
      requestBody:
        description: Client credentials, as a form.
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Token issued.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
              examples:
                token:
                  summary: "Invented: token issued"
                  value:
                    access_token: invented-token-not-in-jwt-format
                    expires_in: 300
                    refresh_expires_in: 0
                    token_type: Bearer
                    not-before-policy: 0
                    scope: invented-scope
        "400":
          description: |
            Form rejected (for example, with `grant_type`). The body follows the
            OAuth2 error format (RFC 6749, section 5.2), not the `Error` schema.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuth2Error"
              examples:
                rejectedForm:
                  summary: "Invented: form rejected"
                  value:
                    error: invalid_request
                    error_description: invented-description
        "403":
          $ref: "#/components/responses/Forbidden403"
        "429":
          $ref: "#/components/responses/TooManyRequests429"
        "500":
          $ref: "#/components/responses/InternalError500"

  /v1.1/varejista/migracoes:
    get:
      operationId: listMigrations
      tags: [Migrations]
      summary: Lists the retailer's migrations
      description: |
        Returns the migrations of the given profile, one page at a time. The profile
        is required in the query and also in the header, as is the month range
        (`mesReferenciaInicial` and `mesReferenciaFinal`). When `indexProximaPagina`
        is filled in, send it back to read the next page.

        The distance between the two months has a ceiling: on 2026-11-01 the sandbox
        accepted 12 months and rejected 24, 48 and 96 (400
        `ERR_MES_REFERENCIA_INICIAL_DIFERENCA`); the ceiling is between 12 and 24,
        probably 12 (D22). A 12-month range returned 71 items and, one hour later, 92
        items in a single page, with `indexProximaPagina` present and no cursor: the
        page holds at least 92 items and the cursor has not been seen yet.
      x-confidence: high
      x-verified-at: "2026-11-01"
      x-source: Collection, retailer APIs section, migrations v1.1; sandbox tests on 2026-10-30 and 2026-11-01.
      x-divergences: [2, 8, 10, 14, 18, 19, 21, 22]
      parameters:
        - $ref: "#/components/parameters/AgentCode"
        - $ref: "#/components/parameters/ProfileCode"
        - $ref: "#/components/parameters/RetailerProfileCodeQuery"
        - $ref: "#/components/parameters/ReferenceMonthStartRequired"
        - $ref: "#/components/parameters/ReferenceMonthEndRequired"
        - $ref: "#/components/parameters/ConsumerUnitCodeQuery"
        - $ref: "#/components/parameters/MigrationStatusQuery"
        - $ref: "#/components/parameters/NextPageIndex"
      responses:
        "200":
          description: Page of migrations.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationList"
              examples:
                page-1:
                  summary: "Invented: first page, with cursor"
                  value:
                    migracao:
                      - idMigracao: 00000000-0000-4000-8000-000000000001
                        codigoUnidadeConsumidora: "000000000000001"
                        codigoAgenteConcessionariaUnidadeConsumidora: "900001_000000000000001"
                        codigoAgenteConcessionaria: 900001
                        codigoAgenteSupridora: null
                        tipoDocumento: CNPJ
                        numeroDocumento: "11111111111111"
                        codigoAgenteVarejista: 900002
                        mesReferencia: "2027-03-01T00:00:00-03:00"
                        dataDenuncia: "2027-01-15T03:00:00Z"
                        codigoPerfilVarejista: 900003
                        dataSolicitacao: "2027-01-10T14:30:15.123-03:00"
                        statusMigracao: CRIADA
                        submercado: SUL
                        valorDHC: 12.5
                        valorMusd: 3.25
                        pagamentoMulta: NAO
                        justificativa: null
                        dataValidacao: null
                        emailUnidadeConsumidora: contato@example.org
                        comentario: "Invented: example comment"
                        idCelebracaoCER: null
                        indicadorProcessoSiga: null
                    indexProximaPagina: invented-cursor-2
                page-2:
                  summary: "Invented: last page, no cursor"
                  value:
                    migracao:
                      - idMigracao: 00000000-0000-4000-8000-000000000002
                        codigoUnidadeConsumidora: "000000000000002"
                        codigoAgenteConcessionariaUnidadeConsumidora: "900001_000000000000002"
                        codigoAgenteConcessionaria: 900001
                        codigoAgenteSupridora: 900004
                        tipoDocumento: CPF
                        numeroDocumento: "22222222222"
                        codigoAgenteVarejista: 900002
                        mesReferencia: "2027-04-01T00:00:00-03:00"
                        dataDenuncia: "2027-02-15T03:00:00Z"
                        codigoPerfilVarejista: 900003
                        dataSolicitacao: "2027-02-10T14:30:15.123-03:00"
                        statusMigracao: CONCLUIDA
                        submercado: NORTE
                        valorDHC: null
                        valorMusd: null
                        pagamentoMulta: SIM
                        justificativa: null
                        dataValidacao: "2027-02-20T09:00:00-03:00"
                        emailUnidadeConsumidora: outro@example.org
                        comentario: null
                        idCelebracaoCER: null
                        indicadorProcessoSiga: null
                    indexProximaPagina: null
        "400":
          description: Missing or invalid parameter.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                profile-required:
                  $ref: "#/components/examples/RetailerProfileRequiredError"
                field-validation:
                  $ref: "#/components/examples/FieldValidationError"
                range-required:
                  $ref: "#/components/examples/MonthRangeRequiredError"
                range-too-wide:
                  $ref: "#/components/examples/MonthRangeTooWideError"
        "403":
          $ref: "#/components/responses/Forbidden403"
        "429":
          $ref: "#/components/responses/TooManyRequests429"
        "500":
          $ref: "#/components/responses/InternalError500"
    post:
      operationId: createMigration
      tags: [Migrations]
      summary: Creates a migration
      description: |
        Registers the migration of a consumer unit to the retailer. The UC has 15
        digits, with a check digit. Repeating the request while there is an active
        migration for the same UC and distributor returns 400
        `ERR_MIGRACAO_SOLICITADA`.
      x-confidence: high
      x-verified-at: "2026-10-30"
      x-source: Collection, retailer APIs section, migrations v1.1; sandbox test on 2026-10-30.
      x-divergences: [2, 12, 14, 10]
      parameters:
        - $ref: "#/components/parameters/AgentCode"
        - $ref: "#/components/parameters/ProfileCode"
      requestBody:
        description: Data of the new migration.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrationRequest"
            examples:
              new:
                summary: "Invented: new migration"
                value:
                  codigoAgenteConcessionaria: 900001
                  codigoAgenteVarejista: 900002
                  codigoPerfilVarejista: 900003
                  codigoUnidadeConsumidora: "000000000000001"
                  dataDenuncia: "2027-01-15"
                  emailUnidadeConsumidora: contato@example.org
                  mesReferencia: "2027-03"
                  tipoDocumento: CNPJ
                  numeroDocumento: "11111111111111"
                  comentario: "Invented: example comment"
      responses:
        "200":
          description: Migration created.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationDetail"
              examples:
                created:
                  $ref: "#/components/examples/MigrationDetailCreated"
        "400":
          description: Invalid body or migration already requested.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid-consumer-unit:
                  $ref: "#/components/examples/InvalidConsumerUnitError"
                migration-already-requested:
                  $ref: "#/components/examples/MigrationAlreadyRequestedError"
        "403":
          $ref: "#/components/responses/Forbidden403"
        "429":
          $ref: "#/components/responses/TooManyRequests429"
        "500":
          $ref: "#/components/responses/InternalError500"

  /v1.1/varejista/migracoes/{idMigracao}:
    get:
      operationId: getMigration
      tags: [Migrations]
      summary: Gets a migration
      description: |
        Returns the migration by its identifier. The response is a list, in the
        detail format, which differs from the list format, with one entry per
        reference month of the migration (observed on 2026-11-01: two entries with the
        same `idMigracao`, differing only in `dataReferencia`, D23). On 2026-10-30
        the list had one item. The API does not document which month is the current
        one; the SDK picks the entry with the most recent month.
      x-confidence: high
      x-verified-at: "2026-11-01"
      x-source: Collection, retailer APIs section, migrations v1.1; sandbox tests on 2026-10-30 and 2026-11-01.
      x-divergences: [2, 10, 14, 20, 21, 23]
      parameters:
        - $ref: "#/components/parameters/AgentCode"
        - $ref: "#/components/parameters/ProfileCode"
        - $ref: "#/components/parameters/MigrationID"
      responses:
        "200":
          description: List with the requested migration, one entry per reference month. On 2026-11-01 the sandbox returned two entries with the same `idMigracao`, differing only in `dataReferencia` (D23).
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MigrationDetail"
              examples:
                migration:
                  summary: "Invented: migration in a one-item list"
                  value:
                    - idMigracao: 00000000-0000-4000-8000-000000000001
                      codigoUnidadeConsumidora: "000000000000001"
                      codigoAgenteConcessionariaUnidadeConsumidora: "900001_000000000000001"
                      codigoAgenteConcessionaria: 900001
                      codigoSupridora: null
                      tipoDocumento: CNPJ
                      numeroDocumento: "11111111111111"
                      codigoAgenteVarejista: 900002
                      dataReferencia: "2027-03-01T00:00:00-03:00"
                      dataDenuncia: "2027-01-15T03:00:00Z"
                      codigoPerfilVarejista: 900003
                      dataSolicitacao: "2027-01-10T14:30:15.123-03:00"
                      statusMigracao: CRIADA
                      submercado: SUL
                      valorDHC: null
                      valorMusd: null
                      pagamentoMulta: NAO
                      justificativa: null
                      dataValidacao: null
                      emailUnidadeConsumidora: contato@example.org
                      comentario: "Invented: example comment"
                      indicadorProcessoSiga: null
                      tipoConectado: null
        "400":
          $ref: "#/components/responses/BadRequest400"
        "403":
          $ref: "#/components/responses/Forbidden403"
        "429":
          $ref: "#/components/responses/TooManyRequests429"
        "500":
          $ref: "#/components/responses/InternalError500"

  /v1/varejista/migracoes/{idMigracao}:
    put:
      operationId: editMigration
      tags: [Migrations]
      summary: Edits the registration data of a migration
      description: |
        Changes registration data of the migration. It is not known whether the PUT
        is partial or total: the SDK sends the whole object. This operation was not
        exercised in the sandbox.
      x-confidence: medium
      x-source: Collection, retailer APIs section, registration edit.
      x-divergences: [10, 14]
      parameters:
        - $ref: "#/components/parameters/AgentCode"
        - $ref: "#/components/parameters/ProfileCode"
        - $ref: "#/components/parameters/MigrationID"
      requestBody:
        description: Registration data to change.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrationEdit"
            examples:
              edit:
                summary: "Invented: e-mail and profile change"
                value:
                  mesReferencia: "2027-04"
                  codigoPerfilVarejista: 900003
                  tipoDocumento: CNPJ
                  numeroDocumento: "11111111111111"
                  emailUnidadeConsumidora: novo@example.org
                  statusMigracao: CRIADA
      responses:
        "200":
          description: Migration edited.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationDetail"
              examples:
                edited:
                  $ref: "#/components/examples/MigrationDetailCreated"
        "400":
          $ref: "#/components/responses/BadRequest400"
        "403":
          $ref: "#/components/responses/Forbidden403"
        "429":
          $ref: "#/components/responses/TooManyRequests429"
        "500":
          $ref: "#/components/responses/InternalError500"

  /v1/varejista/consumo/medicoes:
    get:
      operationId: listMeasurements
      tags: [Measurements]
      summary: Lists consumption measurements
      description: |
        Returns the measurements of a UC within a range, one page at a time. The
        sandbox answered with an empty list in the tests: the item fields come only
        from the public documentation and have low confidence.
      x-confidence: medium
      x-verified-at: "2026-11-01"
      x-source: Collection, retailer APIs section, consumption; sandbox tests on 2026-10-30 and 2026-11-01 (empty list in both).
      x-divergences: [12, 14, 16]
      parameters:
        - $ref: "#/components/parameters/AgentCode"
        - $ref: "#/components/parameters/ProfileCode"
        - $ref: "#/components/parameters/ConsumerUnitCodeMeasurementQuery"
        - $ref: "#/components/parameters/DistributorAgentCodeQuery"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/MeasurementStatusQuery"
        - $ref: "#/components/parameters/NextPageIndex"
      responses:
        "200":
          description: Page of measurements.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeasurementList"
              examples:
                page-1:
                  summary: "Invented: first page, consumption as a string"
                  value:
                    medicoes:
                      - identificadorMedicaoConsumo: 00000000-0000-4000-8000-0000000000a1
                        codigoUnidadeConsumidora: "000000000000001"
                        codigoAgenteConcessionaria: "900001"
                        diaReferencia: "2027-02-01"
                        dataReferenciaConsumo: "2027-02-01T00:15:00-03:00"
                        consumo: "12.345"
                        tipoConsumo: "Invented: type"
                        dataAtualizacao: "2027-02-02T08:00:00-03:00"
                        situacaoMedicao: CONSISTIDA
                    indexProximaPagina: invented-cursor-2
                page-2:
                  summary: "Invented: last page, consumption as a number"
                  value:
                    medicoes:
                      - identificadorMedicaoConsumo: 00000000-0000-4000-8000-0000000000a2
                        codigoUnidadeConsumidora: "000000000000001"
                        codigoAgenteConcessionaria: 900001
                        diaReferencia: "2027-02-01"
                        dataReferenciaConsumo: "2027-02-01T00:30:00-03:00"
                        consumo: 12.5
                        tipoConsumo: "Invented: type"
                        dataAtualizacao: "2027-02-02T08:00:00-03:00"
                        situacaoMedicao: CONSISTIDA
                    indexProximaPagina: null
        "400":
          $ref: "#/components/responses/BadRequest400"
        "403":
          $ref: "#/components/responses/Forbidden403"
        "429":
          $ref: "#/components/responses/TooManyRequests429"
        "500":
          $ref: "#/components/responses/InternalError500"

  /v1/solicitacoes:
    get:
      operationId: listChangeRequests
      tags: [Change requests]
      summary: Lists change requests
      description: |
        Returns the requests of a given type. The response is an object with the list
        in `solicitacao`, and the type is required even though the public documentation
        marks it as optional.
      x-confidence: high
      x-verified-at: "2026-10-30"
      x-source: Collection, Requests section; sandbox test on 2026-10-30.
      x-divergences: [3, 5, 11, 14]
      parameters:
        - $ref: "#/components/parameters/AgentCode"
        - $ref: "#/components/parameters/ProfileCode"
        - $ref: "#/components/parameters/ChangeRequestTypeQuery"
        - $ref: "#/components/parameters/ChangeRequestStatusQuery"
        - $ref: "#/components/parameters/ReferenceMonthStart"
        - $ref: "#/components/parameters/ReferenceMonthEnd"
        - $ref: "#/components/parameters/RequestDateStart"
        - $ref: "#/components/parameters/RequestDateEnd"
        - $ref: "#/components/parameters/ConsumerUnitCodeQuery"
        - $ref: "#/components/parameters/NextPageIndex"
      responses:
        "200":
          description: List of change requests.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequestList"
              examples:
                list:
                  summary: "Invented: one change request"
                  value:
                    solicitacao:
                      - idSolicitacaoAlteracao: 00000000-0000-4000-8000-0000000000b1
                        codigoUnidadeConsumidora: "000000000000001"
                        codigoAgenteConcessionaria: 900001
                        tipoSolicitacao: SUSPENSAO_FORNECIMENTO_RESILICAO
                        mesReferencia: "2027-03"
                        situacaoAlteracao: CRIADA
                        idMigracaoAlterada: 00000000-0000-4000-8000-000000000001
                        indicadorAntecedencia: NAO
                        codigoAgenteVarejistaNovo: null
                        codigoPerfilVarejistaNovo: null
                        codigoAgenteVarejistaAtual: 900002
                        codigoPerfilVarejistaAtual: 900003
                        descricaoJustificativa: "Invented: example justification"
                        dataAtraso: null
                        dataNotificacao: "2027-02-01"
                        dataSolicitacao: "2027-02-02"
                        idCelebracaoCER: null
                    indexProximaPagina: null
        "400":
          description: Missing or invalid parameter.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                field-validation:
                  $ref: "#/components/examples/FieldValidationError"
        "403":
          $ref: "#/components/responses/Forbidden403"
        "429":
          $ref: "#/components/responses/TooManyRequests429"
        "500":
          $ref: "#/components/responses/InternalError500"

  /v1/solicitacoes/representante:
    post:
      operationId: requestRepresentativeChange
      tags: [Change requests]
      summary: Requests a change of representative
      description: |
        The new retailer asks to represent a UC from a given month, and the current
        retailer answers through `decideChangeRequest`. Under the Procedimentos de
        Comercialização (Commercialization Procedures, item 3.37.3), a missing answer
        leads to a compulsory transfer in the intended month. The collection describes
        another rule, automatic approval depending on the notice period; the divergence
        is D5 in `SOURCES.md`. This operation was not exercised in the sandbox.
      x-confidence: medium
      x-source: Collection, Requests section, change of representative.
      x-divergences: [4, 5, 13, 14]
      parameters:
        - $ref: "#/components/parameters/AgentCode"
        - $ref: "#/components/parameters/ProfileCode"
      requestBody:
        description: Data of the change of representative.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepresentativeChangeRequest"
            examples:
              change:
                summary: "Invented: change of representative"
                value:
                  codigoUnidadeConsumidora: "000000000000001"
                  codigoConcessionaria: 900001
                  codigoVarejistaNovo: 900004
                  codigoPerfilVarejistaNovo: 900005
                  mesReferencia: "2027-05"
                  tipoSolicitacao: ALTERACAO_ALFA_VAREJISTA_RESILICAO
      responses:
        "200":
          $ref: "#/components/responses/ChangeRequestCreated200"
        "400":
          $ref: "#/components/responses/BadRequest400"
        "403":
          $ref: "#/components/responses/Forbidden403"
        "429":
          $ref: "#/components/responses/TooManyRequests429"
        "500":
          $ref: "#/components/responses/InternalError500"

  /v1/solicitacoes/suspensao-fornecimento-varejista:
    post:
      operationId: requestSupplySuspension
      tags: [Change requests]
      summary: Requests a supply suspension
      description: |
        The retailer notifies the suspension of supply to a UC. This operation was
        not exercised in the sandbox.
      x-confidence: medium
      x-source: Collection, Requests section, supply suspension.
      x-divergences: [13, 14]
      parameters:
        - $ref: "#/components/parameters/AgentCode"
        - $ref: "#/components/parameters/ProfileCode"
      requestBody:
        description: Data of the supply suspension.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplySuspensionRequest"
            examples:
              suspension:
                summary: "Invented: supply suspension"
