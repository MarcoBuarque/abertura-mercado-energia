                  dataNotificacao: "2027-02-01"
      responses:
        "200":
          $ref: "#/components/responses/ChangeRequestCreated200"
        "400":
          $ref: "#/components/responses/BadRequest400"
        "403":
          $ref: "#/components/responses/Forbidden403"
        "429":
          $ref: "#/components/responses/TooManyRequests429"
        "500":
          $ref: "#/components/responses/InternalError500"

  /v1/solicitacoes/{idSolicitacaoAlteracao}:
    post:
      operationId: decideChangeRequest
      tags: [Change requests]
      summary: Approves or rejects a change request
      description: |
        Records the decision on a request to change representative, return to the
        captive market or suspend supply. This operation was not exercised in the
        sandbox.
      x-confidence: medium
      x-source: Collection, Requests section, approval and rejection.
      x-divergences: [14]
      parameters:
