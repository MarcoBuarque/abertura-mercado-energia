components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: The `client_credentials` flow. The token is valid for about five minutes.
      flows:
        clientCredentials:
          tokenUrl: https://sandbox-api-abm.ccee.org.br/sso/oauth/token
          scopes: {}

  headers:
    RequestId:
      description: Request identifier at the gateway. Useful for support and logs.
      schema:
        type: string
      example: 00000000-0000-4000-8000-0000000000f1

  parameters:
    AgentCode:
      name: codigoAgente
      in: header
      required: true
      description: Code of the agent making the call (the public documentation says "distributor code").
      schema:
        type: integer
      example: 900002
      x-divergences: [7]
    ProfileCode:
      name: codigoPerfil
      in: header
      required: true
      description: Code of the agent's profile.
      schema:
        type: integer
      example: 900003
    MigrationID:
      name: idMigracao
      in: path
      required: true
      description: Identifier of the migration.
      schema:
        type: string
      example: 00000000-0000-4000-8000-000000000001
    ChangeRequestID:
      name: idSolicitacaoAlteracao
      in: path
      required: true
      description: Identifier of the change request.
      schema:
        type: string
      example: 00000000-0000-4000-8000-0000000000b1
    RetailerProfileCodeQuery:
      name: codigoPerfilVarejista
      in: query
      required: true
      description: Retailer profile. Required in the query, in addition to the `codigoPerfil` header.
      schema:
        type: integer
      example: 900003
      x-divergences: [8]
    ReferenceMonthStart:
      name: mesReferenciaInicial
      in: query
      required: false
      description: First month of the range, in YYYY-MM format.
      schema:
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}$
      example: 2027-01
      x-divergences: [2]
    ReferenceMonthEnd:
      name: mesReferenciaFinal
      in: query
      required: false
      description: Last month of the range, in YYYY-MM format.
      schema:
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}$
      example: 2027-12
      x-divergences: [2]
    ReferenceMonthStartRequired:
      name: mesReferenciaInicial
      in: query
      required: true
      description: |
        First month of the range, in YYYY-MM format. Required on the migration list:
        without it the sandbox answers 400
        `ERR_MES_REFERENCIA_INICIAL_OBRIGATORIO`. A range that is too wide returns
        400 `ERR_MES_REFERENCIA_INICIAL_DIFERENCA` (12 months passed; 24, 48 and 96 did not; the ceiling is between 12 and 24, D22).
      schema:
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}$
      example: 2027-01
      x-divergences: [2, 18, 19]
    ReferenceMonthEndRequired:
      name: mesReferenciaFinal
      in: query
      required: true
      description: |
        Last month of the range, in YYYY-MM format. Required on the migration list,
        together with the start month. The maximum distance between the two is
        between 12 and 24 months: 12 were accepted and 24, 48 and 96 rejected
        (`ERR_MES_REFERENCIA_INICIAL_DIFERENCA`, D22).
      schema:
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}$
      example: 2027-01
      x-divergences: [2, 18, 19]
    ConsumerUnitCodeQuery:
      name: codigoUnidadeConsumidora
      in: query
      required: false
      description: Consumer unit code. No format validation on the filter.
      schema:
        type: string
      example: "000000000000001"
    ConsumerUnitCodeMeasurementQuery:
      name: codigoUnidadeConsumidora
      in: query
      required: true
      description: Consumer unit code. No `pattern`, because the v1 measurements accepted a 10-digit UC.
      schema:
        type: string
      example: "000000000000001"
      x-divergences: [12]
    DistributorAgentCodeQuery:
      name: codigoAgenteConcessionaria
      in: query
      required: true
      description: Code of the UC's distributor.
      schema:
        type: integer
      example: 900001
      x-divergences: [11, 14]
    MigrationStatusQuery:
      name: statusMigracao
      in: query
      required: false
      description: Filters by migration status.
      schema:
        $ref: "#/components/schemas/MigrationStatus"
    StartDate:
      name: dataInicio
      in: query
      required: true
      description: Start of the range, with date, time and offset.
      schema:
        type: string
        format: date-time
      example: "2027-02-01T00:00:00-03:00"
    EndDate:
      name: dataFim
      in: query
      required: true
      description: End of the range, with date, time and offset.
      schema:
        type: string
        format: date-time
      example: "2027-02-28T23:45:00-03:00"
    MeasurementStatusQuery:
      name: situacaoMedicao
      in: query
      required: false
      description: Filters by measurement status.
      schema:
        type: string
        enum: [CONSISTIDA, REJEITADA]
      example: CONSISTIDA
      x-confidence: low
    ChangeRequestTypeQuery:
      name: tipoSolicitacao
      in: query
      required: true
      description: Type of the request. Actually required, although the public documentation marks it as optional.
      schema:
        type: string
        enum:
          - ALTERACAO_ALFA_VAREJISTA_RESILICAO
          - ALTERACAO_ALFA_VAREJISTA_RESOLUCAO
          - ALTERACAO_ALFA_VAREJISTA_DESLIGAMENTO
          - ALTERACAO_RETORNO_CATIVO_RESILICAO
          - ALTERACAO_RETORNO_CATIVO_RESOLUCAO
          - ALTERACAO_RETORNO_CATIVO_DESLIGAMENTO
          - SUSPENSAO_FORNECIMENTO_RESILICAO
          - SUSPENSAO_FORNECIMENTO_RESOLUCAO
          - SUSPENSAO_FORNECIMENTO_DESLIGAMENTO
          - SUSPENSAO_FORNECIMENTO_RESOLUCAO_UC_CONCESSIONARIA
      example: SUSPENSAO_FORNECIMENTO_RESILICAO
      x-divergences: [11]
    ChangeRequestStatusQuery:
      name: situacaoAlteracao
      in: query
      required: false
      description: Filters by request status. The public documentation marks it as required, but it is optional.
      schema:
        type: string
        enum: [CRIADA, CONCLUIDA, REPROVADA, CANCELADA, EXPIRADA]
      example: CRIADA
      x-divergences: [11]
    RequestDateStart:
      name: dataSolicitacaoInicial
      in: query
      required: false
      description: First day of the request date range. The format was not tested and the public collection contradicts itself (text with `DD-MM-YYYY`, example URL with `YYYY-MM-DD`); the spec follows the URL.
      schema:
        type: string
        format: date
      example: "2027-02-01"
      x-confidence: low
      x-divergences: [2]
    RequestDateEnd:
      name: dataSolicitacaoFinal
      in: query
      required: false
      description: Last day of the request date range. The format was not tested and the public collection contradicts itself (text with `DD-MM-YYYY`, example URL with `YYYY-MM-DD`); the spec follows the URL.
      schema:
        type: string
        format: date
      example: "2027-02-28"
      x-confidence: low
      x-divergences: [2]
    NextPageIndex:
      name: indexProximaPagina
      in: query
      required: false
      description: Cursor returned by the previous page. No observed response carried a filled-in cursor.
      schema:
        type: string
      example: invented-cursor-2
      x-confidence: low

  examples:
    FieldValidationError:
      summary: "Invented: invalid field"
      value:
        timestamp: "2027-01-10T10:00:00.000-03:00"
        status: 400
        error: ERR_VALIDACAO_CAMPOS
        message: "Invented: the given field is not valid"
    RetailerProfileRequiredError:
      summary: "Invented: profile missing from the query"
      value:
        timestamp: "2027-01-10T10:00:00.000-03:00"
        status: 400
        error: ERR_PERFIL_VAREJISTA_OBRIGATORIO
        message: "Invented: provide the retailer profile"
    InvalidConsumerUnitError:
      summary: "Invented: UC in the wrong format"
      value:
        timestamp: "2027-01-10T10:00:00.000-03:00"
        status: 400
        error: ERR_VALIDACAO_CAMPOS
        message: "Invented: the consumer unit must have 15 digits"
    MigrationAlreadyRequestedError:
      summary: "Invented: an active migration already exists for the UC"
      value:
        timestamp: "2027-01-10T10:00:00.000-03:00"
        status: 400
        error: ERR_MIGRACAO_SOLICITADA
        message: "Invented: an active migration already exists for this UC and distributor"
    MonthRangeRequiredError:
      summary: "Invented: month range missing"
      value:
        timestamp: "2027-01-10T10:00:00.000-03:00"
        status: 400
        error: ERR_MES_REFERENCIA_INICIAL_OBRIGATORIO
        message: "Invented: provide the reference month range"
    MonthRangeTooWideError:
      summary: "Invented: month range too wide"
      value:
        timestamp: "2027-01-10T10:00:00.000-03:00"
        status: 400
        error: ERR_MES_REFERENCIA_INICIAL_DIFERENCA
        message: "Invented: the month range is larger than allowed"
    InvalidCredentialError:
      summary: "Invented: credential refused"
      value:
        timestamp: "2027-01-10T10:00:00Z"
        status: 403
        error: ERR_CREDENCIAL_INVALIDA
        message: "Invented: token, agent or profile not accepted"
    RateLimitError:
      summary: "Invented: rate limit"
      value:
        timestamp: "2027-01-10T10:00:00Z"
        status: 429
        error: Invented
        message: "Invented: rate limit exceeded"
    InternalFailureError:
      summary: "Invented: internal failure"
      value:
        timestamp: "2027-01-10T10:00:00Z"
        status: 500
        error: Invented
        message: "Invented: internal failure"
    MigrationDetailCreated:
      summary: "Invented: migration in the detail format"
      value:
        idMigracao: 00000000-0000-4000-8000-000000000001
        codigoUnidadeConsumidora: "000000000000001"
        codigoAgenteConcessionariaUnidadeConsumidora: "900001_000000000000001"
        codigoAgenteConcessionaria: 900001
        codigoSupridora: null
        tipoDocumento: CNPJ
        numeroDocumento: "11111111111111"
        codigoAgenteVarejista: 900002
        dataReferencia: "2027-03-01T00:00:00-03:00"
        dataDenuncia: "2027-01-15T03:00:00Z"
        codigoPerfilVarejista: 900003
        dataSolicitacao: "2027-01-10T14:30:15.123-03:00"
        statusMigracao: CRIADA
        submercado: SUL
        valorDHC: null
        valorMusd: null
        pagamentoMulta: NAO
        justificativa: null
        dataValidacao: null
        emailUnidadeConsumidora: contato@example.org
        comentario: "Invented: example comment"
        indicadorProcessoSiga: null
        tipoConectado: null
    ChangeRequestCreated:
      summary: "Invented: change request created"
      value:
        idSolicitacaoAlteracao: 00000000-0000-4000-8000-0000000000b1
        codigoUnidadeConsumidora: "000000000000001"
        codigoAgenteConcessionaria: 900001
        tipoSolicitacao: SUSPENSAO_FORNECIMENTO_RESILICAO
        mesReferencia: "2027-03"
        situacaoAlteracao: CRIADA
        idMigracaoAlterada: 00000000-0000-4000-8000-000000000001
        indicadorAntecedencia: NAO
        codigoAgenteVarejistaNovo: null
        codigoPerfilVarejistaNovo: null
        codigoAgenteVarejistaAtual: 900002
        codigoPerfilVarejistaAtual: 900003
        descricaoJustificativa: "Invented: example justification"
        dataAtraso: null
        dataNotificacao: "2027-02-01"
        dataSolicitacao: "2027-02-02"
        idCelebracaoCER: null

  responses:
    BadRequest400:
      description: |
        Invalid request. The `error` field gives the reason (`ERR_VALIDACAO_CAMPOS`,
        `ERR_PERFIL_VAREJISTA_OBRIGATORIO` or `ERR_MIGRACAO_SOLICITADA`); validation
        stops at the first field with a problem. Do not repeat the request without
        fixing it.
        See the [error catalog](https://marcobuarque.github.io/abertura-mercado-energia/errors).
      headers:
        x-amzn-RequestId:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            field-validation:
              $ref: "#/components/examples/FieldValidationError"
    Forbidden403:
      description: |
        Authentication or authorization refused. The gateway returns 403 (never 401)
        for an invalid token and for an agent or profile that does not belong to the
        credential. The cases can only be told apart by the `message`. When the
        `x-amzn-ErrorType` header is present, the refusal came from the authorizer,
        before the backend.
        See the [error catalog](https://marcobuarque.github.io/abertura-mercado-energia/errors#invalid-credential-authorizer).
      headers:
        x-amzn-RequestId:
          $ref: "#/components/headers/RequestId"
        x-amzn-ErrorType:
          description: Error type set by the gateway authorizer.
          schema:
            type: string
          example: AccessDeniedException
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid-credential:
              $ref: "#/components/examples/InvalidCredentialError"
      x-divergences: [9]
    TooManyRequests429:
      description: |
        Rate limit exceeded. Not observed; no known `Retry-After`. Wait before
        repeating; on a write, repeat only if the response carries `x-amzn-ErrorType`.
        See the
        [error catalog](https://marcobuarque.github.io/abertura-mercado-energia/errors#rate-limited).
      headers:
        x-amzn-RequestId:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            rate-limit:
              $ref: "#/components/examples/RateLimitError"
      x-confidence: low
    InternalError500:
      description: |
        Internal failure. Not observed. On a write, the outcome is uncertain: check
        the state before repeating.
        See the
        [error catalog](https://marcobuarque.github.io/abertura-mercado-energia/errors#internal-error).
      headers:
        x-amzn-RequestId:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            internal:
              $ref: "#/components/examples/InternalFailureError"
      x-confidence: low
    ChangeRequestCreated200:
      description: Change request recorded or updated.
      headers:
        x-amzn-RequestId:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ChangeRequest"
          examples:
            change-request:
              $ref: "#/components/examples/ChangeRequestCreated"

  schemas:
    Error:
      type: object
      description: |
        Error body of the backend and of the authorizer, with the same four fields,
        as `application/json` (not `application/problem+json`). The Go SDK delivers
        the same error as an RFC 9457 Problem Details object; the catalog explains
        each code and each situation without a code.

        Known codes:

        - `ERR_CREDENCIAL_INVALIDA`: 403. Token, agent or profile refused.
        - `ERR_VALIDACAO_CAMPOS`: 400. A field was refused; validation stops at the first one.
        - `ERR_PERFIL_VAREJISTA_OBRIGATORIO`: 400. The query did not carry the profile.
        - `ERR_MIGRACAO_SOLICITADA`: 400. There is already an active migration for the UC and the distributor.
        - `ERR_MES_REFERENCIA_INICIAL_OBRIGATORIO`: 400. The migration list did not carry the month range ([catalog](docs/errors.md#month-range-required)).
        - `ERR_MES_REFERENCIA_INICIAL_DIFERENCA`: 400. The month range is too wide ([catalog](docs/errors.md#month-range-too-wide)).
      externalDocs:
        description: Error catalog, with what to do and when to retry.
        url: https://marcobuarque.github.io/abertura-mercado-energia/errors
      required: [error, message]
      properties:
        timestamp:
          type: string
          description: |
            Instant of the error, in RFC 3339 with an offset. The fractional second has
            a variable length (2 or 3 digits observed, with trailing zeros trimmed) or is
            absent, as in the authorizer (D21). No `format`, so as not to reject these
            variations.
        status:
          type: integer
        error:
          type: string
          description: Stable textual error code.
          x-extensible-enum:
            - ERR_VALIDACAO_CAMPOS
            - ERR_PERFIL_VAREJISTA_OBRIGATORIO
            - ERR_MIGRACAO_SOLICITADA
            - ERR_MES_REFERENCIA_INICIAL_OBRIGATORIO
            - ERR_MES_REFERENCIA_INICIAL_DIFERENCA
            - ERR_CREDENCIAL_INVALIDA
        message:
          type: string
          description: Human-readable text, in Portuguese.
      x-divergences: [6]

    OAuth2Error:
      type: object
      description: |
        Body of the 400 of `POST /sso/oauth/token`, in the OAuth2 error format (RFC
        6749, section 5.2). It has no `status` or `timestamp`; it is not the `Error` schema.
      required: [error]
      properties:
        error:
          type: string
          description: OAuth2 code. It is not known which of them the server returns.
          x-confidence: medium
          x-extensible-enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
        error_description:
          type: string
          description: Human-readable text.
      x-divergences: [17]

    TokenRequest:
      type: object
      description: |
        Only `client_id` and `client_secret`. A form with `grant_type` was rejected
        with 400 (OAuth2 error body) on 2026-11-01.
      required: [client_id, client_secret]
      properties:
        client_id:
          type: string
          description: Client identifier.
        client_secret:
          type: string
          format: password
          description: Client secret. Never write it to a log.

    Token:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          description: Validity in seconds. 300 observed, always with three digits (confirmed on 2026-11-01); the public documentation shows 298.
        refresh_expires_in:
          type: integer
          description: Always 0 in the sandbox; there is no refresh token.
        token_type:
          type: string
        not-before-policy:
          type: integer
        scope:
          type: string

    MigrationStatus:
      type: string
      description: Migration status. The list may grow.
      x-extensible-enum:
        - CRIADA
        - CONCLUIDA
        - REPROVADA
        - ENCERRADA
        - CANCELADA
        - EXPIRADA
        - APROVADA_COM_PENDENCIA

    MigrationSummary:
      type: object
      description: Migration in the list format (v1.1).
      required: [idMigracao]
      properties:
        idMigracao:
          type: string
        codigoUnidadeConsumidora:
          type: string
          nullable: true
        codigoAgenteConcessionariaUnidadeConsumidora:
          type: string
          nullable: true
          description: Composition "<distributor>_<UC>".
        codigoAgenteConcessionaria:
          type: integer
          nullable: true
        codigoAgenteSupridora:
          type: integer
          nullable: true
        tipoDocumento:
          type: string
          nullable: true
          x-extensible-enum: [CPF, CNPJ]
        numeroDocumento:
          type: string
          nullable: true
        codigoAgenteVarejista:
          type: integer
          nullable: true
        mesReferencia:
          type: string
          format: date-time
          nullable: true
          description: |
            Not `YYYY-MM`: it is an RFC 3339 date and time with an offset and no
            fractional second (for example, day 1 of the month at midnight at
            -03:00). Observed on 2026-11-01 (D21). The query parameter
            remains `YYYY-MM`.
          example: "2027-03-01T00:00:00-03:00"
          x-confidence: high
          x-verified-at: "2026-11-01"
        dataDenuncia:
          type: string
          format: date-time
          nullable: true
          description: RFC 3339 in UTC, with `Z` (D21).
          example: "2027-01-15T03:00:00Z"
        codigoPerfilVarejista:
          type: integer
          nullable: true
        dataSolicitacao:
          type: string
          format: date-time
          nullable: true
          description: RFC 3339 with three fractional digits and an offset (D21).
          example: "2027-01-10T14:30:15.123-03:00"
        statusMigracao:
          type: string
          nullable: true
          x-extensible-enum:
            - CRIADA
            - CONCLUIDA
            - REPROVADA
            - ENCERRADA
            - CANCELADA
            - EXPIRADA
            - APROVADA_COM_PENDENCIA
        submercado:
          type: string
          nullable: true
        valorDHC:
          type: number
          nullable: true
        valorMusd:
          type: number
          nullable: true
        pagamentoMulta:
          type: string
          nullable: true
          x-extensible-enum: [SIM, NAO]
        justificativa:
          type: string
          nullable: true
        dataValidacao:
          type: string
          format: date-time
          nullable: true
          description: RFC 3339 with an offset; the fractional second appears in some responses and not in others (D21).
          example: "2027-02-20T09:00:00-03:00"
        emailUnidadeConsumidora:
          type: string
          nullable: true
        comentario:
          type: string
          nullable: true
        idCelebracaoCER:
          type: string
          nullable: true
        indicadorProcessoSiga:
          type: string
          nullable: true
      x-divergences: [2, 10, 14]

    MigrationList:
      type: object
      required: [migracao]
      properties:
        migracao:
          type: array
          items:
            $ref: "#/components/schemas/MigrationSummary"
        indexProximaPagina:
          type: string
          nullable: true
          description: Cursor of the next page. It was null in every test.
          x-confidence: low

    MigrationDetail:
      type: object
      description: |
        Migration in the detail format (POST, GET by identifier and PUT). It uses
        `dataReferencia` and `codigoSupridora` where the list uses `mesReferencia`
        and `codigoAgenteSupridora`, adds `tipoConectado` and does not carry
        `idCelebracaoCER`.
