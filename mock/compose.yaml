# Sobe o mock em http://localhost:4010:
#   docker compose -f mock/compose.yaml up --build
services:
  mock:
    build:
      context: ..
      dockerfile: mock/Dockerfile
    image: abertura-mercado-energia-mock:local
    # O Prism fixado só existe para amd64. No Mac com Apple Silicon roda por
    # emulação (a subida leva alguns segundos a mais); em CI amd64 é nativo.
    platform: linux/amd64
    ports:
      - "127.0.0.1:4010:4010"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(4010,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
