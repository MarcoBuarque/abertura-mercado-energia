# Starts the mock at http://localhost:4010:
#   docker compose -f mock/compose.yaml up --build
services:
  mock:
    build:
      context: ..
      dockerfile: mock/Dockerfile
      args:
        # The Makefile and the smoke test export SPEC_VERSION from info.version.
        SPEC_VERSION: ${SPEC_VERSION:-unknown}
    image: abertura-mercado-energia-mock:local
    # The pinned Prism only exists for amd64. On a Mac with Apple Silicon it runs
    # under emulation (startup takes a few seconds longer); on amd64 CI it is native.
    platform: linux/amd64
    ports:
      - "127.0.0.1:4010:4010"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(4010,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
