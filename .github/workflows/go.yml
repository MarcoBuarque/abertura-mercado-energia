# CI for the Go SDK. Each step calls a Makefile target (which does cd abertura);
# `make ci` runs the same targets locally. It is also called by release-go.yml.
name: go

on:
  push:
    branches: [main]
    paths: ['abertura/**', 'openapi/**', 'scripts/**', 'Makefile', '.github/workflows/go.yml']
  pull_request:
    paths: ['abertura/**', 'openapi/**', 'scripts/**', 'Makefile', '.github/workflows/go.yml']
  workflow_call:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: go ${{ matrix.go }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The two supported series, always at the latest patch (check-latest), so
        # govulncheck does not fail on an old stdlib. go.mod stays at go 1.26.0.
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: abertura/go.sum
      - name: go mod tidy without changes
        run: make go-tidy
      - name: Generation and spec copy drift
        run: make go-gen
      - name: Build, vet and tests
        run: make go-test
      - name: Tests with -race and coverage
        run: make go-race
      - name: golangci-lint v2
        run: make go-lint
      - name: Sandbox contract (only what makes no network calls)
        run: make go-contract
      - name: govulncheck
        run: make go-vuln
      - name: Dependencies
        run: make go-deps
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go-${{ matrix.go }}
          path: out/go-coverage.out
          if-no-files-found: error
