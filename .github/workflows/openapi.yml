# Checagens da spec OpenAPI. Cada passo chama um alvo do Makefile; `make ci`
# roda os mesmos alvos localmente.
name: openapi

on:
  push:
    branches: [main]
    paths: ['openapi/**', 'mock/**', 'docs/**', 'scripts/**', 'Makefile', '.github/workflows/openapi.yml']
  pull_request:
    paths: ['openapi/**', 'mock/**', 'docs/**', 'scripts/**', 'Makefile', '.github/workflows/openapi.yml']

permissions:
  contents: read

concurrency:
  group: openapi-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # o spec-diff compara com a última tag openapi/v*
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - name: Regras próprias do lint provadas
        run: make testa-regras
      - name: Lint da spec (vacuum)
        run: make spec-lint
      - name: Exemplos inventados
        run: make spec-exemplos
      - name: Compatibilidade com a última tag (oasdiff)
        run: make spec-diff
      - name: Página Redoc
        run: make docs
      - name: Smoke do mock (as 10 operações)
        run: make mock-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: out/docs/
          if-no-files-found: error
