# OpenAPI spec checks. Each step calls a Makefile target; `make ci` runs the
# same targets locally.
name: openapi

on:
  push:
    branches: [main]
    paths: ['openapi/**', 'mock/**', 'docs/**', 'scripts/**', 'Makefile', '.github/workflows/openapi.yml']
  pull_request:
    paths: ['openapi/**', 'mock/**', 'docs/**', 'scripts/**', 'Makefile', '.github/workflows/openapi.yml']

permissions:
  contents: read

concurrency:
  group: openapi-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # spec-diff compares with the latest openapi/v* tag
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - name: Own lint rules proven
        run: make test-rules
      - name: Reading of the Breaking section proven
        run: make test-breaking-spec
      - name: Spec lint (vacuum)
        run: make spec-lint
      - name: Invented examples
        run: make spec-examples
      - name: breaking-spec label checked against the Breaking section
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'breaking-spec')
        run: |
          scripts/breaking-spec.sh --require
          echo "BREAKING_SPEC=1" >> "$GITHUB_ENV"
      - name: Compatibility with the latest tag (oasdiff)
        run: make spec-diff
      - name: Redoc page
        run: make docs
      - name: Mock smoke test (the 10 operations)
        run: make mock-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: out/docs/
          if-no-files-found: error
