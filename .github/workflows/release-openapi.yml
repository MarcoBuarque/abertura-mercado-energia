# Spec release: tag openapi/vX.Y.Z (or openapi/vX.Y.Z-rc.N).
# A pre-release (-rc.N) becomes a release marked as pre-release and publishes
# neither Pages nor the image's "latest" tag.
name: release-openapi

on:
  push:
    tags: ['openapi/v*']

permissions:
  contents: read

concurrency:
  group: release-openapi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - name: Tag equals info.version
        run: make check-tag KIND=openapi TAG="$TAG"
        env:
          TAG: ${{ github.ref_name }}
      - name: Spec lint and own rules
        run: make test-rules spec-lint spec-examples
      # spec-diff is left out: at this commit the "latest openapi/v* tag" is the
      # release tag itself. Compatibility was already checked in the PR.
      - name: Redoc page
        run: make docs
      - name: Mock smoke test
        run: make mock-smoke

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # creates the release and attaches the spec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release with the spec as an asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          case "$TAG" in *-rc.*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" openapi/abertura.yaml \
            --verify-tag \
            --title "Spec ${TAG#openapi/}" \
            --notes "Unofficial description of the Market Opening API. Changes in openapi/CHANGELOG.md at this tag." \
            "${flags[@]}"

  # Pages and the image are only valid with a public repository. The condition
  # reads github.event.repository.private from the push event, not the current
  # state: push the final tags only after the repository is public. Re-running
  # the workflow repeats the same event and therefore the same value; to publish
  # later, the tag must be pushed again.
  pages:
    needs: verify
    if: github.event.repository.private == false && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - run: make docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/docs
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  mock-image:
    needs: verify
    if: github.event.repository.private == false # public GHCR only after the repository is public
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish the mock image to GHCR
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          name="ghcr.io/${REPO,,}-mock"
          version="${TAG#openapi/v}"
          make mock-image MOCK_IMAGE="$name" MOCK_TAG="$version"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$name:$version"
          case "$version" in
            *-rc.*) ;;
            *)
              docker tag "$name:$version" "$name:latest"
              docker push "$name:latest"
              ;;
          esac
