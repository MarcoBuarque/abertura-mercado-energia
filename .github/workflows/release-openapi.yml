# Release da spec: tag openapi/vX.Y.Z (ou openapi/vX.Y.Z-rc.N).
# Pré-versão (-rc.N) vira release marcado como pré-release e não publica Pages
# nem a tag "latest" da imagem.
name: release-openapi

on:
  push:
    tags: ['openapi/v*']

permissions:
  contents: read

concurrency:
  group: release-openapi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifica:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - name: Tag igual a info.version
        run: make checa-tag TIPO=openapi TAG="$TAG"
        env:
          TAG: ${{ github.ref_name }}
      - name: Lint da spec e regras próprias
        run: make testa-regras spec-lint spec-exemplos
      # spec-diff fica de fora: neste commit a "última tag openapi/v*" é a
      # própria tag do release. A compatibilidade já foi checada no PR.
      - name: Página Redoc
        run: make docs
      - name: Smoke do mock
        run: make mock-smoke

  release:
    needs: verifica
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # cria o release e anexa a spec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release com a spec como asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          case "$TAG" in *-rc.*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" openapi/abertura.yaml \
            --verify-tag \
            --title "Spec ${TAG#openapi/}" \
            --notes "Descrição não oficial da API de Abertura de Mercado. Mudanças em openapi/CHANGELOG.md nesta tag." \
            "${flags[@]}"

  # Pages e imagem só depois que o repositório for público. Antes disso o job
  # é pulado (a condição lê o atributo do repositório no momento da execução).
  pages:
    needs: verifica
    if: github.event.repository.private == false && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - run: make docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/docs
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  imagem:
    needs: verifica
    if: github.event.repository.private == false # GHCR público só depois do repositório público
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Constrói e publica a imagem do mock no GHCR
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          nome="ghcr.io/${REPO,,}-mock"
          versao="${TAG#openapi/v}"
          make mock-imagem MOCK_IMAGEM="$nome" MOCK_TAG="$versao"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$nome:$versao"
          case "$versao" in
            *-rc.*) ;;
            *)
              docker tag "$nome:$versao" "$nome:latest"
              docker push "$nome:latest"
              ;;
          esac
