# Guarda de segredos do repositório. As regras padrão do gitleaks continuam
# ligadas; as regras abaixo cobrem o que este projeto não pode ter nunca.
# Nenhuma regra contém o valor de uma credencial.
title = "abertura-mercado-energia"

[extend]
useDefault = true

[[rules]]
id = "abertura-jwt"
description = "Token JWT (cabeçalho e corpo em base64url)"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.'''
keywords = ["eyj"]

[[rules]]
id = "abertura-atribuicao-de-segredo"
description = "client_secret atribuído a um valor entre aspas"
regex = '''(?i)client_secret["']?\s*[:=]\s*["'][^"'\s]{8,}["']'''
keywords = ["client_secret"]

[[rules]]
id = "abertura-exportacao-postman"
description = "Exportação de coleção ou ambiente do Postman"
regex = '''["]_postman_id["]|schema\.getpostman\.com'''
keywords = ["_postman_id", "getpostman"]

# Sem [allowlist]: nada é ignorado. Qualquer exceção exige justificativa em revisão.
