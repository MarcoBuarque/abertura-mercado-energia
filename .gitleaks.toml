# Secrets guard for the repository. The default gitleaks rules stay on; the
# rules below cover what this project must never have.
# No rule contains the value of a credential.
title = "abertura-mercado-energia"

[extend]
useDefault = true

[[rules]]
id = "abertura-jwt"
description = "JWT token (header and body in base64url)"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.'''
keywords = ["eyj"]

[[rules]]
id = "abertura-secret-assignment"
description = "client_secret assigned to a quoted value"
regex = '''(?i)client_secret["']?\s*[:=]\s*["'][^"'\s]{8,}["']'''
keywords = ["client_secret"]

[[rules]]
id = "abertura-postman-export"
description = "Postman collection or environment export"
regex = '''["]_postman_id["]|schema\.getpostman\.com'''
keywords = ["_postman_id", "getpostman"]

# No [allowlist]: nothing is ignored. Any exception requires a justification in review.
