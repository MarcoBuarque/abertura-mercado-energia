  /v1/solicitacoes/{idSolicitacaoAlteracao}:
    post:
      operationId: decidirSolicitacao
      tags: [Solicitacoes]
      summary: Aprova ou reprova uma solicitação
      description: |
        Registra a decisão sobre uma solicitação de troca de representante,
        retorno ao cativo ou suspensão de fornecimento. Esta operação não foi
        exercitada no sandbox.
      x-confianca: media
