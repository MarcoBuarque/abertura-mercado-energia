components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: Fluxo `client_credentials`. O token vale cerca de cinco minutos.
      flows:
        clientCredentials:
          tokenUrl: https://sandbox-api-abm.ccee.org.br/sso/oauth/token
          scopes: {}

  headers:
    RequestId:
      description: Identificador da requisição no gateway. Útil para suporte e logs.
      schema:
        type: string
      example: 00000000-0000-4000-8000-0000000000f1

  parameters:
    CodigoAgente:
      name: codigoAgente
      in: header
      required: true
      description: Código do agente que faz a chamada (a documentação pública diz "código da concessionária").
      schema:
        type: integer
      example: 900002
      x-divergencias: [7]
    CodigoPerfil:
      name: codigoPerfil
      in: header
      required: true
      description: Código do perfil do agente.
      schema:
        type: integer
      example: 900003
    IdMigracao:
      name: idMigracao
      in: path
      required: true
      description: Identificador da migração.
      schema:
        type: string
      example: 00000000-0000-4000-8000-000000000001
    IdSolicitacaoAlteracao:
      name: idSolicitacaoAlteracao
      in: path
      required: true
      description: Identificador da solicitação de alteração.
      schema:
        type: string
      example: 00000000-0000-4000-8000-0000000000b1
    CodigoPerfilVarejistaQuery:
      name: codigoPerfilVarejista
      in: query
      required: true
      description: Perfil do varejista. Obrigatório na consulta, além do cabeçalho `codigoPerfil`.
      schema:
        type: integer
      example: 900003
      x-divergencias: [8]
    MesReferenciaInicial:
      name: mesReferenciaInicial
      in: query
      required: false
      description: Primeiro mês do intervalo, no formato AAAA-MM.
      schema:
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}$
      example: 2027-01
      x-divergencias: [2]
    MesReferenciaFinal:
      name: mesReferenciaFinal
      in: query
      required: false
      description: Último mês do intervalo, no formato AAAA-MM.
      schema:
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}$
      example: 2027-12
      x-divergencias: [2]
    MesReferenciaInicialObrigatorio:
      name: mesReferenciaInicial
      in: query
      required: true
      description: |
        Primeiro mês do intervalo, no formato AAAA-MM. Obrigatório na listagem de
        migrações: sem ele o sandbox responde 400
        `ERR_MES_REFERENCIA_INICIAL_OBRIGATORIO`. Um intervalo largo demais volta
        400 `ERR_MES_REFERENCIA_INICIAL_DIFERENCA` (um mês passou; 96 meses não).
      schema:
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}$
      example: 2027-01
      x-divergencias: [2, 18, 19]
    MesReferenciaFinalObrigatorio:
      name: mesReferenciaFinal
      in: query
      required: true
      description: |
        Último mês do intervalo, no formato AAAA-MM. Obrigatório na listagem de
        migrações, junto com o mês inicial. A distância máxima entre os dois não
        foi medida: 1 mês foi aceito e 96 foram recusados
        (`ERR_MES_REFERENCIA_INICIAL_DIFERENCA`).
      schema:
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}$
      example: 2027-01
      x-divergencias: [2, 18, 19]
    CodigoUnidadeConsumidoraQuery:
      name: codigoUnidadeConsumidora
      in: query
      required: false
      description: Código da unidade consumidora. Sem validação de formato no filtro.
      schema:
        type: string
      example: "000000000000001"
    CodigoUnidadeConsumidoraMedicaoQuery:
      name: codigoUnidadeConsumidora
      in: query
      required: true
      description: Código da unidade consumidora. Sem `pattern`, porque as medições da v1 aceitaram UC de 10 dígitos.
      schema:
        type: string
      example: "000000000000001"
      x-divergencias: [12]
    CodigoAgenteConcessionariaQuery:
      name: codigoAgenteConcessionaria
      in: query
      required: true
      description: Código da concessionária da UC.
      schema:
        type: integer
      example: 900001
      x-divergencias: [11, 14]
    StatusMigracaoQuery:
      name: statusMigracao
      in: query
      required: false
      description: Filtra pelo status da migração.
      schema:
        $ref: "#/components/schemas/StatusMigracao"
    DataInicio:
      name: dataInicio
      in: query
      required: true
      description: Início do intervalo, com data, hora e deslocamento.
      schema:
        type: string
        format: date-time
      example: "2027-02-01T00:00:00-03:00"
    DataFim:
      name: dataFim
      in: query
      required: true
      description: Fim do intervalo, com data, hora e deslocamento.
      schema:
        type: string
        format: date-time
      example: "2027-02-28T23:45:00-03:00"
    SituacaoMedicaoQuery:
      name: situacaoMedicao
      in: query
      required: false
      description: Filtra pela situação da medição.
      schema:
        type: string
        enum: [CONSISTIDA, REJEITADA]
      example: CONSISTIDA
      x-confianca: baixa
    TipoSolicitacaoQuery:
      name: tipoSolicitacao
      in: query
      required: true
      description: Tipo da solicitação. Obrigatório de fato, embora a documentação pública o marque como opcional.
      schema:
        type: string
        enum:
          - ALTERACAO_ALFA_VAREJISTA_RESILICAO
          - ALTERACAO_ALFA_VAREJISTA_RESOLUCAO
          - ALTERACAO_ALFA_VAREJISTA_DESLIGAMENTO
          - ALTERACAO_RETORNO_CATIVO_RESILICAO
          - ALTERACAO_RETORNO_CATIVO_RESOLUCAO
          - ALTERACAO_RETORNO_CATIVO_DESLIGAMENTO
          - SUSPENSAO_FORNECIMENTO_RESILICAO
          - SUSPENSAO_FORNECIMENTO_RESOLUCAO
          - SUSPENSAO_FORNECIMENTO_DESLIGAMENTO
          - SUSPENSAO_FORNECIMENTO_RESOLUCAO_UC_CONCESSIONARIA
      example: SUSPENSAO_FORNECIMENTO_RESILICAO
      x-divergencias: [11]
    SituacaoAlteracaoQuery:
      name: situacaoAlteracao
      in: query
      required: false
      description: Filtra pela situação da solicitação. A documentação pública a marca como obrigatória, mas ela é opcional.
      schema:
        type: string
        enum: [CRIADA, CONCLUIDA, REPROVADA, CANCELADA, EXPIRADA]
      example: CRIADA
      x-divergencias: [11]
    DataSolicitacaoInicial:
      name: dataSolicitacaoInicial
      in: query
      required: false
      description: Primeiro dia do intervalo da data de solicitação. O formato não foi testado e a coleção pública se contradiz (texto com `DD-MM-AAAA`, URL de exemplo com `AAAA-MM-DD`); a spec segue a URL.
      schema:
        type: string
        format: date
      example: "2027-02-01"
      x-confianca: baixa
      x-divergencias: [2]
    DataSolicitacaoFinal:
      name: dataSolicitacaoFinal
      in: query
      required: false
      description: Último dia do intervalo da data de solicitação. O formato não foi testado e a coleção pública se contradiz (texto com `DD-MM-AAAA`, URL de exemplo com `AAAA-MM-DD`); a spec segue a URL.
      schema:
        type: string
        format: date
      example: "2027-02-28"
      x-confianca: baixa
      x-divergencias: [2]
    IndexProximaPagina:
      name: indexProximaPagina
      in: query
      required: false
      description: Cursor devolvido pela página anterior. Nenhuma resposta observada trouxe cursor preenchido.
      schema:
        type: string
      example: cursor-inventado-2
      x-confianca: baixa

  examples:
    ErroValidacaoCampos:
      summary: "Inventado: campo inválido"
      value:
        timestamp: "2027-01-10T10:00:00.000-03:00"
        status: 400
        error: ERR_VALIDACAO_CAMPOS
        message: "Inventado: o campo informado não é válido"
    ErroPerfilObrigatorio:
      summary: "Inventado: perfil ausente na consulta"
      value:
        timestamp: "2027-01-10T10:00:00.000-03:00"
        status: 400
        error: ERR_PERFIL_VAREJISTA_OBRIGATORIO
        message: "Inventado: informe o perfil do varejista"
    ErroUcInvalida:
      summary: "Inventado: UC fora do formato"
      value:
        timestamp: "2027-01-10T10:00:00.000-03:00"
        status: 400
        error: ERR_VALIDACAO_CAMPOS
        message: "Inventado: a unidade consumidora precisa ter 15 dígitos"
    ErroMigracaoSolicitada:
      summary: "Inventado: já existe migração ativa para a UC"
      value:
        timestamp: "2027-01-10T10:00:00.000-03:00"
        status: 400
        error: ERR_MIGRACAO_SOLICITADA
        message: "Inventado: já existe migração ativa para esta UC e concessionária"
    ErroFaixaObrigatoria:
      summary: "Inventado: faixa de meses ausente"
      value:
        timestamp: "2027-01-10T10:00:00.000-03:00"
        status: 400
        error: ERR_MES_REFERENCIA_INICIAL_OBRIGATORIO
        message: "Inventado: informe o intervalo de meses de referência"
    ErroFaixaLargaDemais:
      summary: "Inventado: faixa de meses larga demais"
      value:
        timestamp: "2027-01-10T10:00:00.000-03:00"
        status: 400
        error: ERR_MES_REFERENCIA_INICIAL_DIFERENCA
        message: "Inventado: o intervalo de meses é maior que o permitido"
    ErroCredencialInvalida:
      summary: "Inventado: credencial recusada"
      value:
        timestamp: "2027-01-10T10:00:00Z"
        status: 403
        error: ERR_CREDENCIAL_INVALIDA
        message: "Inventado: token, agente ou perfil não aceitos"
    ErroLimite:
      summary: "Inventado: limite de requisições"
      value:
        timestamp: "2027-01-10T10:00:00Z"
        status: 429
        error: Inventado
        message: "Inventado: limite de requisições excedido"
    ErroInterno:
      summary: "Inventado: falha interna"
      value:
        timestamp: "2027-01-10T10:00:00Z"
        status: 500
        error: Inventado
        message: "Inventado: falha interna"
    MigracaoDetalheCriada:
      summary: "Inventado: migração no formato do detalhe"
      value:
        idMigracao: 00000000-0000-4000-8000-000000000001
        codigoUnidadeConsumidora: "000000000000001"
        codigoAgenteConcessionariaUnidadeConsumidora: "900001_000000000000001"
        codigoAgenteConcessionaria: 900001
        codigoSupridora: null
        tipoDocumento: CNPJ
        numeroDocumento: "11111111111111"
        codigoAgenteVarejista: 900002
        dataReferencia: "2027-03-01T00:00:00-03:00"
        dataDenuncia: "2027-01-15T03:00:00Z"
        codigoPerfilVarejista: 900003
        dataSolicitacao: "2027-01-10T14:30:15.123-03:00"
        statusMigracao: CRIADA
        submercado: SUL
        valorDHC: null
        valorMusd: null
        pagamentoMulta: NAO
        justificativa: null
        dataValidacao: null
        emailUnidadeConsumidora: contato@example.org
        comentario: "Inventado: exemplo de comentário"
        indicadorProcessoSiga: null
        tipoConectado: null
    SolicitacaoCriada:
      summary: "Inventado: solicitação criada"
      value:
        idSolicitacaoAlteracao: 00000000-0000-4000-8000-0000000000b1
        codigoUnidadeConsumidora: "000000000000001"
        codigoAgenteConcessionaria: 900001
        tipoSolicitacao: SUSPENSAO_FORNECIMENTO_RESILICAO
        mesReferencia: "2027-03"
        situacaoAlteracao: CRIADA
        idMigracaoAlterada: 00000000-0000-4000-8000-000000000001
        indicadorAntecedencia: NAO
        codigoAgenteVarejistaNovo: null
        codigoPerfilVarejistaNovo: null
        codigoAgenteVarejistaAtual: 900002
        codigoPerfilVarejistaAtual: 900003
        descricaoJustificativa: "Inventado: exemplo de justificativa"
        dataAtraso: null
        dataNotificacao: "2027-02-01"
        dataSolicitacao: "2027-02-02"
        idCelebracaoCER: null

  responses:
    Requisicao400:
      description: |
        Requisição inválida. O `error` diz o motivo (`ERR_VALIDACAO_CAMPOS`,
        `ERR_PERFIL_VAREJISTA_OBRIGATORIO` ou `ERR_MIGRACAO_SOLICITADA`); a
        validação para no primeiro campo com problema. Não repita sem corrigir.
        Veja o [catálogo de erros](https://marcobuarque.github.io/abertura-mercado-energia/erros).
      headers:
        x-amzn-RequestId:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          examples:
            validacao-campos:
              $ref: "#/components/examples/ErroValidacaoCampos"
    Acesso403:
      description: |
        Autenticação ou autorização recusada. O gateway devolve 403 (nunca 401)
        para token inválido e para agente ou perfil que não pertencem à credencial.
        Os casos só se distinguem pela `message`. Com o cabeçalho
        `x-amzn-ErrorType`, a recusa veio do autorizador, antes do backend.
        Veja o [catálogo de erros](https://marcobuarque.github.io/abertura-mercado-energia/erros#credencial-invalida-autorizador).
      headers:
        x-amzn-RequestId:
          $ref: "#/components/headers/RequestId"
        x-amzn-ErrorType:
          description: Tipo de erro marcado pelo autorizador do gateway.
          schema:
            type: string
          example: AccessDeniedException
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          examples:
            credencial-invalida:
              $ref: "#/components/examples/ErroCredencialInvalida"
      x-divergencias: [9]
    Limite429:
      description: |
        Limite de requisições excedido. Não observado; sem `Retry-After`
        conhecido. Espere antes de repetir; numa escrita, só repita se a
        resposta trouxer `x-amzn-ErrorType`. Veja o
        [catálogo de erros](https://marcobuarque.github.io/abertura-mercado-energia/erros#limite-de-requisicoes).
      headers:
        x-amzn-RequestId:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          examples:
            limite:
              $ref: "#/components/examples/ErroLimite"
      x-confianca: baixa
    Interno500:
      description: |
        Falha interna. Não observada. Numa escrita, o resultado é incerto:
        confira o estado antes de repetir. Veja o
        [catálogo de erros](https://marcobuarque.github.io/abertura-mercado-energia/erros#erro-interno).
      headers:
        x-amzn-RequestId:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          examples:
            interno:
              $ref: "#/components/examples/ErroInterno"
      x-confianca: baixa
    SolicitacaoCriada200:
      description: Solicitação registrada ou atualizada.
      headers:
        x-amzn-RequestId:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Solicitacao"
          examples:
            solicitacao:
              $ref: "#/components/examples/SolicitacaoCriada"

  schemas:
    Erro:
      type: object
      description: |
        Corpo de erro do backend e do autorizador, com os mesmos quatro campos,
        em `application/json` (não em `application/problem+json`). O SDK Go
        entrega o mesmo erro como Problem Details da RFC 9457; o catálogo
        explica cada código e cada situação sem código.

        Códigos conhecidos:

        - `ERR_CREDENCIAL_INVALIDA`: 403. Token, agente ou perfil recusados.
        - `ERR_VALIDACAO_CAMPOS`: 400. Um campo foi recusado; a validação para no primeiro.
        - `ERR_PERFIL_VAREJISTA_OBRIGATORIO`: 400. A consulta não trouxe o perfil.
        - `ERR_MIGRACAO_SOLICITADA`: 400. Já existe migração ativa para a UC e a concessionária.
        - `ERR_MES_REFERENCIA_INICIAL_OBRIGATORIO`: 400. A listagem de migrações não trouxe o intervalo de meses ([catálogo](docs/erros.md#faixa-de-meses-obrigatoria)).
        - `ERR_MES_REFERENCIA_INICIAL_DIFERENCA`: 400. O intervalo de meses é largo demais ([catálogo](docs/erros.md#faixa-de-meses-larga-demais)).
      externalDocs:
        description: Catálogo de erros, com o que fazer e quando repetir.
        url: https://marcobuarque.github.io/abertura-mercado-energia/erros
      required: [error, message]
      properties:
        timestamp:
          type: string
          description: |
            Instante do erro, em RFC 3339 com deslocamento. A fração de segundo
            tem comprimento variável (2 ou 3 dígitos observados, com zeros à
            direita cortados) ou não existe, como no autorizador (D21). Sem
            `format`, para não rejeitar essas variações.
        status:
          type: integer
        error:
          type: string
          description: Código textual estável do erro.
          x-extensible-enum:
            - ERR_VALIDACAO_CAMPOS
            - ERR_PERFIL_VAREJISTA_OBRIGATORIO
            - ERR_MIGRACAO_SOLICITADA
            - ERR_MES_REFERENCIA_INICIAL_OBRIGATORIO
            - ERR_MES_REFERENCIA_INICIAL_DIFERENCA
            - ERR_CREDENCIAL_INVALIDA
        message:
          type: string
          description: Texto para humanos, em português.
      x-divergencias: [6]

    ErroOAuth2:
      type: object
      description: |
        Corpo do 400 de `POST /sso/oauth/token`, no formato de erro OAuth2 (RFC
        6749, seção 5.2). Não tem `status` nem `timestamp`; não é o `Erro`.
      required: [error]
      properties:
        error:
          type: string
          description: Código OAuth2. Não se viu qual deles o servidor devolve.
          x-confianca: media
          x-extensible-enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
        error_description:
          type: string
          description: Texto para humanos.
      x-divergencias: [17]

    TokenRequisicao:
      type: object
      description: |
        Só `client_id` e `client_secret`. Um formulário com `grant_type` foi
        recusado com 400 (corpo de erro OAuth2) em 01/11/2026.
      required: [client_id, client_secret]
      properties:
        client_id:
          type: string
