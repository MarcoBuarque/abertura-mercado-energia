openapi: 3.0.3
info:
  title: API de Abertura de Mercado (descrição não oficial)
  version: 0.1.0
  description: |
    Descrição não oficial, escrita à mão, de parte das APIs de varejo da abertura
    do mercado de energia. Este projeto é independente: não é afiliado,
    patrocinado nem endossado pela Câmara de Comercialização de Energia Elétrica
    (CCEE), e nada aqui substitui a documentação do operador.

    A spec descreve o que a API devolve de fato, conforme testes no ambiente
    sandbox, e não só o que a documentação pública informa. Cada operação traz
    `x-confianca` (`alta`, `media` ou `baixa`) e, quando `alta`,
    `x-verificado-em` com a data da última conferência. As divergências entre a
    documentação e o observado estão em `FONTES.md`, numeradas de D1 a D16 e
    citadas em `x-divergencias`.

    Todos os exemplos são inventados: UC com zeros à frente, códigos de agente,
    perfil e concessionária na faixa 900000, documentos com dígitos repetidos e
    e-mails em `example.org`.
  contact:
    name: Projeto abertura-mercado-energia
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  x-fonte:
    colecao: https://documenter.getpostman.com/view/30322966/2sAXqqchhJ
    extraida-em: "2026-10-30T10:52:36-03:00"
    teste-no-sandbox-em: "2026-10-30T11:56:47-03:00"
servers:
  - url: https://sandbox-api-abm.ccee.org.br
    description: Sandbox, com agentes fictícios.
  - url: http://localhost:4010
    description: Mock local (Prism) com os exemplos desta spec.
  - url: https://api-abm.ccee.org.br
    description: Produção.
security:
  - oauth2: []
tags:
  - name: Autenticacao
    x-displayName: Autenticação
    description: Emissão do token de acesso.
  - name: Migracoes
    x-displayName: Migrações
    description: Migrações de unidades consumidoras para o mercado livre, lado do varejista.
  - name: Medicoes
    x-displayName: Medições
    description: Medições de consumo das unidades consumidoras.
  - name: Solicitacoes
    x-displayName: Solicitações
    description: Solicitações de alteração (troca de representante, suspensão, retorno ao cativo).
paths:
  /sso/oauth/token:
    post:
      operationId: obterToken
      tags: [Autenticacao]
      summary: Obtém o token de acesso
      description: |
        Troca as credenciais do cliente por um token de acesso (fluxo
        `client_credentials`). Envie só `client_id` e `client_secret`: o
        formulário com `grant_type` foi recusado com 400 em 01/11/2026. O token
        vale cerca de cinco minutos e não há token de renovação: peça outro
        antes de vencer. O corpo do 400 desta rota é um objeto de erro OAuth2,
        não o `Erro` das demais rotas.
      security: []
      x-confianca: alta
      x-verificado-em: "2026-11-01"
      x-fonte: Coleção, seção Autenticação; testes no sandbox em 30/10/2026 e 01/11/2026.
      x-divergencias: [15, 17]
      requestBody:
        description: Credenciais do cliente, em formulário.
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequisicao"
      responses:
        "200":
          description: Token emitido.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
              examples:
                token:
                  summary: "Inventado: token emitido"
                  value:
                    access_token: token-inventado-sem-formato-jwt
                    expires_in: 300
                    refresh_expires_in: 0
                    token_type: Bearer
                    not-before-policy: 0
                    scope: escopo-inventado
        "400":
          description: |
            Formulário recusado (por exemplo, com `grant_type`). O corpo segue o
            formato de erro OAuth2 (RFC 6749, seção 5.2), não o `Erro`.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroOAuth2"
              examples:
                formularioRecusado:
                  summary: "Inventado: formulário recusado"
                  value:
                    error: invalid_request
                    error_description: descricao-inventada
        "403":
          $ref: "#/components/responses/Acesso403"
        "429":
          $ref: "#/components/responses/Limite429"
        "500":
          $ref: "#/components/responses/Interno500"

  /v1.1/varejista/migracoes:
    get:
      operationId: listarMigracoes
      tags: [Migracoes]
      summary: Lista migrações do varejista
      description: |
        Devolve as migrações do perfil informado, uma página por vez. O perfil
        é exigido na consulta e também no cabeçalho, assim como o intervalo de
        meses (`mesReferenciaInicial` e `mesReferenciaFinal`). Quando `indexProximaPagina`
        vem preenchido, envie-o de volta para ler a página seguinte.

        A distância entre os dois meses tem teto: em 01/11/2026 o sandbox
        aceitou 12 meses e recusou 24, 48 e 96 (400
        `ERR_MES_REFERENCIA_INICIAL_DIFERENCA`); o teto está entre 12 e 24,
        provavelmente 12 (D22). Uma faixa de 12 meses devolveu 71 itens numa só
        página, com `indexProximaPagina` presente e sem cursor: a página tem ao
        menos 71 itens e o cursor ainda não foi visto.
      x-confianca: alta
      x-verificado-em: "2026-11-01"
      x-fonte: Coleção, seção APIs do varejista, migrações v1.1; testes no sandbox em 30/10/2026 e 01/11/2026.
      x-divergencias: [2, 8, 10, 14, 18, 19, 21, 22]
      parameters:
        - $ref: "#/components/parameters/CodigoAgente"
        - $ref: "#/components/parameters/CodigoPerfil"
        - $ref: "#/components/parameters/CodigoPerfilVarejistaQuery"
        - $ref: "#/components/parameters/MesReferenciaInicialObrigatorio"
        - $ref: "#/components/parameters/MesReferenciaFinalObrigatorio"
        - $ref: "#/components/parameters/CodigoUnidadeConsumidoraQuery"
        - $ref: "#/components/parameters/StatusMigracaoQuery"
        - $ref: "#/components/parameters/IndexProximaPagina"
      responses:
        "200":
          description: Página de migrações.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaMigracoes"
              examples:
                pagina-1:
                  summary: "Inventado: primeira página, com cursor"
                  value:
                    migracao:
                      - idMigracao: 00000000-0000-4000-8000-000000000001
                        codigoUnidadeConsumidora: "000000000000001"
                        codigoAgenteConcessionariaUnidadeConsumidora: "900001_000000000000001"
                        codigoAgenteConcessionaria: 900001
                        codigoAgenteSupridora: null
                        tipoDocumento: CNPJ
                        numeroDocumento: "11111111111111"
                        codigoAgenteVarejista: 900002
                        mesReferencia: "2027-03-01T00:00:00-03:00"
                        dataDenuncia: "2027-01-15T03:00:00Z"
                        codigoPerfilVarejista: 900003
                        dataSolicitacao: "2027-01-10T14:30:15.123-03:00"
                        statusMigracao: CRIADA
                        submercado: SUL
                        valorDHC: 12.5
                        valorMusd: 3.25
                        pagamentoMulta: NAO
                        justificativa: null
                        dataValidacao: null
                        emailUnidadeConsumidora: contato@example.org
                        comentario: "Inventado: exemplo de comentário"
                        idCelebracaoCER: null
                        indicadorProcessoSiga: null
                    indexProximaPagina: cursor-inventado-2
                pagina-2:
                  summary: "Inventado: última página, sem cursor"
                  value:
                    migracao:
                      - idMigracao: 00000000-0000-4000-8000-000000000002
                        codigoUnidadeConsumidora: "000000000000002"
                        codigoAgenteConcessionariaUnidadeConsumidora: "900001_000000000000002"
                        codigoAgenteConcessionaria: 900001
                        codigoAgenteSupridora: 900004
                        tipoDocumento: CPF
                        numeroDocumento: "22222222222"
                        codigoAgenteVarejista: 900002
                        mesReferencia: "2027-04-01T00:00:00-03:00"
                        dataDenuncia: "2027-02-15T03:00:00Z"
                        codigoPerfilVarejista: 900003
                        dataSolicitacao: "2027-02-10T14:30:15.123-03:00"
                        statusMigracao: CONCLUIDA
                        submercado: NORTE
                        valorDHC: null
                        valorMusd: null
                        pagamentoMulta: SIM
                        justificativa: null
                        dataValidacao: "2027-02-20T09:00:00-03:00"
                        emailUnidadeConsumidora: outro@example.org
                        comentario: null
                        idCelebracaoCER: null
                        indicadorProcessoSiga: null
                    indexProximaPagina: null
        "400":
          description: Parâmetro ausente ou inválido.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                perfil-obrigatorio:
                  $ref: "#/components/examples/ErroPerfilObrigatorio"
                validacao-campos:
                  $ref: "#/components/examples/ErroValidacaoCampos"
                faixa-obrigatoria:
                  $ref: "#/components/examples/ErroFaixaObrigatoria"
                faixa-larga-demais:
                  $ref: "#/components/examples/ErroFaixaLargaDemais"
        "403":
          $ref: "#/components/responses/Acesso403"
        "429":
          $ref: "#/components/responses/Limite429"
        "500":
          $ref: "#/components/responses/Interno500"
    post:
      operationId: criarMigracao
      tags: [Migracoes]
      summary: Cria uma migração
      description: |
        Registra a migração de uma unidade consumidora para o varejista. A UC
        tem 15 dígitos, com dígito verificador. Repetir a requisição enquanto
        houver migração ativa para a mesma UC e concessionária devolve 400
        `ERR_MIGRACAO_SOLICITADA`.
      x-confianca: alta
      x-verificado-em: "2026-10-30"
      x-fonte: Coleção, seção APIs do varejista, migrações v1.1; teste no sandbox em 30/10/2026.
      x-divergencias: [2, 12, 14, 10]
      parameters:
        - $ref: "#/components/parameters/CodigoAgente"
        - $ref: "#/components/parameters/CodigoPerfil"
      requestBody:
        description: Dados da nova migração.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NovaMigracao"
            examples:
              nova:
                summary: "Inventado: nova migração"
                value:
                  codigoAgenteConcessionaria: 900001
                  codigoAgenteVarejista: 900002
                  codigoPerfilVarejista: 900003
                  codigoUnidadeConsumidora: "000000000000001"
                  dataDenuncia: "2027-01-15"
                  emailUnidadeConsumidora: contato@example.org
                  mesReferencia: "2027-03"
                  tipoDocumento: CNPJ
                  numeroDocumento: "11111111111111"
                  comentario: "Inventado: exemplo de comentário"
      responses:
        "200":
          description: Migração criada.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigracaoDetalhe"
              examples:
                criada:
                  $ref: "#/components/examples/MigracaoDetalheCriada"
        "400":
          description: Corpo inválido ou migração já solicitada.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                uc-invalida:
                  $ref: "#/components/examples/ErroUcInvalida"
                migracao-solicitada:
                  $ref: "#/components/examples/ErroMigracaoSolicitada"
        "403":
          $ref: "#/components/responses/Acesso403"
        "429":
          $ref: "#/components/responses/Limite429"
        "500":
          $ref: "#/components/responses/Interno500"

  /v1.1/varejista/migracoes/{idMigracao}:
    get:
      operationId: obterMigracao
      tags: [Migracoes]
      summary: Obtém uma migração
      description: |
        Devolve a migração pelo identificador. A resposta é uma lista, no
        formato do detalhe, que difere do formato da listagem. Em 30/10/2026
        a lista tinha um item; em 01/11/2026 há indício (hipótese, ainda sem
        confirmação) de que o sandbox devolva mais de um item para um id, e o
        SDK escolhe o item pelo `idMigracao` (D23).
      x-confianca: media
      x-verificado-em: "2026-11-01"
      x-fonte: Coleção, seção APIs do varejista, migrações v1.1; testes no sandbox em 30/10/2026 e 01/11/2026.
      x-divergencias: [2, 10, 14, 20, 21, 23]
      parameters:
        - $ref: "#/components/parameters/CodigoAgente"
        - $ref: "#/components/parameters/CodigoPerfil"
        - $ref: "#/components/parameters/IdMigracao"
      responses:
        "200":
          description: Lista com a migração pedida.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MigracaoDetalhe"
              examples:
                migracao:
                  summary: "Inventado: migração em lista de um item"
                  value:
                    - idMigracao: 00000000-0000-4000-8000-000000000001
                      codigoUnidadeConsumidora: "000000000000001"
                      codigoAgenteConcessionariaUnidadeConsumidora: "900001_000000000000001"
                      codigoAgenteConcessionaria: 900001
                      codigoSupridora: null
                      tipoDocumento: CNPJ
                      numeroDocumento: "11111111111111"
                      codigoAgenteVarejista: 900002
                      dataReferencia: "2027-03-01T00:00:00-03:00"
                      dataDenuncia: "2027-01-15T03:00:00Z"
                      codigoPerfilVarejista: 900003
                      dataSolicitacao: "2027-01-10T14:30:15.123-03:00"
                      statusMigracao: CRIADA
                      submercado: SUL
                      valorDHC: null
                      valorMusd: null
                      pagamentoMulta: NAO
                      justificativa: null
                      dataValidacao: null
                      emailUnidadeConsumidora: contato@example.org
                      comentario: "Inventado: exemplo de comentário"
                      indicadorProcessoSiga: null
                      tipoConectado: null
        "400":
          $ref: "#/components/responses/Requisicao400"
        "403":
          $ref: "#/components/responses/Acesso403"
        "429":
          $ref: "#/components/responses/Limite429"
        "500":
          $ref: "#/components/responses/Interno500"

  /v1/varejista/migracoes/{idMigracao}:
    put:
      operationId: editarMigracao
      tags: [Migracoes]
      summary: Edita dados cadastrais de uma migração
      description: |
        Altera dados cadastrais da migração. Não se sabe se o PUT é parcial ou
        total: o SDK envia o objeto inteiro. Esta operação não foi exercitada
        no sandbox.
      x-confianca: media
      x-fonte: Coleção, seção APIs do varejista, edição cadastral.
      x-divergencias: [10, 14]
      parameters:
        - $ref: "#/components/parameters/CodigoAgente"
        - $ref: "#/components/parameters/CodigoPerfil"
        - $ref: "#/components/parameters/IdMigracao"
      requestBody:
        description: Dados cadastrais a alterar.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdicaoMigracao"
            examples:
              edicao:
                summary: "Inventado: troca de e-mail e perfil"
                value:
                  mesReferencia: "2027-04"
                  codigoPerfilVarejista: 900003
                  tipoDocumento: CNPJ
                  numeroDocumento: "11111111111111"
                  emailUnidadeConsumidora: novo@example.org
                  statusMigracao: CRIADA
      responses:
        "200":
          description: Migração editada.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigracaoDetalhe"
              examples:
                editada:
                  $ref: "#/components/examples/MigracaoDetalheCriada"
        "400":
          $ref: "#/components/responses/Requisicao400"
        "403":
          $ref: "#/components/responses/Acesso403"
        "429":
          $ref: "#/components/responses/Limite429"
        "500":
          $ref: "#/components/responses/Interno500"

  /v1/varejista/consumo/medicoes:
    get:
      operationId: listarMedicoes
      tags: [Medicoes]
      summary: Lista medições de consumo
      description: |
        Devolve as medições de uma UC em um intervalo, uma página por vez. O
        sandbox respondeu lista vazia nos testes: os campos do item vêm só da
        documentação pública e têm confiança baixa.
      x-confianca: media
      x-verificado-em: "2026-11-01"
      x-fonte: Coleção, seção APIs do varejista, consumo; testes no sandbox em 30/10/2026 e 01/11/2026 (lista vazia nas duas).
      x-divergencias: [12, 14, 16]
      parameters:
        - $ref: "#/components/parameters/CodigoAgente"
        - $ref: "#/components/parameters/CodigoPerfil"
        - $ref: "#/components/parameters/CodigoUnidadeConsumidoraMedicaoQuery"
        - $ref: "#/components/parameters/CodigoAgenteConcessionariaQuery"
        - $ref: "#/components/parameters/DataInicio"
        - $ref: "#/components/parameters/DataFim"
        - $ref: "#/components/parameters/SituacaoMedicaoQuery"
        - $ref: "#/components/parameters/IndexProximaPagina"
      responses:
        "200":
          description: Página de medições.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaMedicoes"
              examples:
                pagina-1:
                  summary: "Inventado: primeira página, consumo como string"
                  value:
                    medicoes:
                      - identificadorMedicaoConsumo: 00000000-0000-4000-8000-0000000000a1
                        codigoUnidadeConsumidora: "000000000000001"
                        codigoAgenteConcessionaria: "900001"
                        diaReferencia: "2027-02-01"
                        dataReferenciaConsumo: "2027-02-01T00:15:00-03:00"
                        consumo: "12.345"
                        tipoConsumo: "Inventado: tipo"
                        dataAtualizacao: "2027-02-02T08:00:00-03:00"
                        situacaoMedicao: CONSISTIDA
                    indexProximaPagina: cursor-inventado-2
                pagina-2:
                  summary: "Inventado: última página, consumo como número"
                  value:
                    medicoes:
                      - identificadorMedicaoConsumo: 00000000-0000-4000-8000-0000000000a2
                        codigoUnidadeConsumidora: "000000000000001"
                        codigoAgenteConcessionaria: 900001
                        diaReferencia: "2027-02-01"
                        dataReferenciaConsumo: "2027-02-01T00:30:00-03:00"
                        consumo: 12.5
                        tipoConsumo: "Inventado: tipo"
                        dataAtualizacao: "2027-02-02T08:00:00-03:00"
                        situacaoMedicao: CONSISTIDA
                    indexProximaPagina: null
        "400":
          $ref: "#/components/responses/Requisicao400"
        "403":
          $ref: "#/components/responses/Acesso403"
        "429":
          $ref: "#/components/responses/Limite429"
        "500":
          $ref: "#/components/responses/Interno500"

  /v1/solicitacoes:
    get:
      operationId: listarSolicitacoes
      tags: [Solicitacoes]
      summary: Lista solicitações de alteração
      description: |
        Devolve as solicitações de um tipo. A resposta é um objeto com a lista em
        `solicitacao`, e o tipo é obrigatório mesmo marcado como opcional na
        documentação pública.
      x-confianca: alta
      x-verificado-em: "2026-10-30"
      x-fonte: Coleção, seção Solicitações; teste no sandbox em 30/10/2026.
      x-divergencias: [3, 5, 11, 14]
      parameters:
        - $ref: "#/components/parameters/CodigoAgente"
        - $ref: "#/components/parameters/CodigoPerfil"
        - $ref: "#/components/parameters/TipoSolicitacaoQuery"
        - $ref: "#/components/parameters/SituacaoAlteracaoQuery"
        - $ref: "#/components/parameters/MesReferenciaInicial"
        - $ref: "#/components/parameters/MesReferenciaFinal"
        - $ref: "#/components/parameters/DataSolicitacaoInicial"
        - $ref: "#/components/parameters/DataSolicitacaoFinal"
        - $ref: "#/components/parameters/CodigoUnidadeConsumidoraQuery"
        - $ref: "#/components/parameters/IndexProximaPagina"
      responses:
        "200":
          description: Lista de solicitações.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaSolicitacoes"
              examples:
                lista:
                  summary: "Inventado: uma solicitação"
                  value:
                    solicitacao:
                      - idSolicitacaoAlteracao: 00000000-0000-4000-8000-0000000000b1
                        codigoUnidadeConsumidora: "000000000000001"
                        codigoAgenteConcessionaria: 900001
                        tipoSolicitacao: SUSPENSAO_FORNECIMENTO_RESILICAO
                        mesReferencia: "2027-03"
                        situacaoAlteracao: CRIADA
                        idMigracaoAlterada: 00000000-0000-4000-8000-000000000001
                        indicadorAntecedencia: NAO
                        codigoAgenteVarejistaNovo: null
                        codigoPerfilVarejistaNovo: null
                        codigoAgenteVarejistaAtual: 900002
                        codigoPerfilVarejistaAtual: 900003
                        descricaoJustificativa: "Inventado: exemplo de justificativa"
                        dataAtraso: null
                        dataNotificacao: "2027-02-01"
                        dataSolicitacao: "2027-02-02"
                        idCelebracaoCER: null
                    indexProximaPagina: null
        "400":
          description: Parâmetro ausente ou inválido.
          headers:
            x-amzn-RequestId:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                validacao-campos:
                  $ref: "#/components/examples/ErroValidacaoCampos"
        "403":
          $ref: "#/components/responses/Acesso403"
        "429":
          $ref: "#/components/responses/Limite429"
        "500":
          $ref: "#/components/responses/Interno500"

  /v1/solicitacoes/representante:
    post:
      operationId: solicitarTrocaRepresentante
      tags: [Solicitacoes]
      summary: Solicita troca de representante
      description: |
        O novo varejista pede para representar uma UC a partir de um mês, e o
        varejista atual responde por `decidirSolicitacao`. Pelo Procedimento de
        Comercialização (item 3.37.3), a falta de resposta leva à transferência
        compulsória no mês pretendido. A coleção descreve outra regra, de
        aprovação automática conforme a antecedência; a divergência está na D5
        de `FONTES.md`. Esta operação não foi exercitada no sandbox.
      x-confianca: media
      x-fonte: Coleção, seção Solicitações, troca de representante.
      x-divergencias: [4, 5, 13, 14]
      parameters:
        - $ref: "#/components/parameters/CodigoAgente"
        - $ref: "#/components/parameters/CodigoPerfil"
      requestBody:
        description: Dados da troca de representante.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitacaoRepresentante"
            examples:
              troca:
                summary: "Inventado: troca de representante"
                value:
                  codigoUnidadeConsumidora: "000000000000001"
                  codigoConcessionaria: 900001
                  codigoVarejistaNovo: 900004
                  codigoPerfilVarejistaNovo: 900005
                  mesReferencia: "2027-05"
                  tipoSolicitacao: ALTERACAO_ALFA_VAREJISTA_RESILICAO
      responses:
        "200":
          $ref: "#/components/responses/SolicitacaoCriada200"
        "400":
          $ref: "#/components/responses/Requisicao400"
        "403":
          $ref: "#/components/responses/Acesso403"
        "429":
          $ref: "#/components/responses/Limite429"
        "500":
          $ref: "#/components/responses/Interno500"

  /v1/solicitacoes/suspensao-fornecimento-varejista:
    post:
      operationId: solicitarSuspensaoFornecimento
      tags: [Solicitacoes]
      summary: Solicita suspensão de fornecimento
      description: |
        O varejista notifica a suspensão do fornecimento de uma UC. Esta
        operação não foi exercitada no sandbox.
      x-confianca: media
      x-fonte: Coleção, seção Solicitações, suspensão de fornecimento.
      x-divergencias: [13, 14]
      parameters:
        - $ref: "#/components/parameters/CodigoAgente"
        - $ref: "#/components/parameters/CodigoPerfil"
      requestBody:
        description: Dados da suspensão de fornecimento.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitacaoSuspensao"
            examples:
              suspensao:
                summary: "Inventado: suspensão de fornecimento"
                value:
                  codigoUnidadeConsumidora: "000000000000001"
                  codigoConcessionaria: 900001
                  tipoSolicitacao: SUSPENSAO_FORNECIMENTO_RESILICAO
                  dataNotificacao: "2027-02-01"
      responses:
        "200":
