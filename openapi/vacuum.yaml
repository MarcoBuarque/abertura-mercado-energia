# Spec lint rules. Extends the vacuum `recommended` ruleset and adds the
# project's own rules, all with severity `error`. Each one is proven by a
# minimal spec in openapi/testes/regras/ (scripts/test-rules.sh). The rule ids
# keep their original names because the test script looks them up by id.
extends:
  - [vacuum:oas, recommended]

rules:
  abertura-confianca:
    description: Every operation declares x-confidence as high, medium or low.
    message: "{{error}}"
    severity: error
    given: $.paths[*][get,post,put,patch,delete]
    then:
      - field: x-confidence
        function: defined
      - field: x-confidence
        function: schema
        functionOptions:
          schema:
            type: string
            enum: [high, medium, low]

  abertura-verificado-em:
    description: An operation with high confidence carries x-verified-at in YYYY-MM-DD format.
    message: "{{error}}"
    severity: error
    given: $.paths[*][?(@['x-confidence'] == 'high')]
    then:
      - field: x-verified-at
        function: defined
      - field: x-verified-at
        function: pattern
        functionOptions:
          match: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$

  abertura-operation-id:
    description: The operationId is camelCase.
    message: "{{error}}"
    severity: error
    given: $.paths[*][get,post,put,patch,delete]
    then:
      - field: operationId
        function: defined
      - field: operationId
        function: pattern
        functionOptions:
          match: ^[a-z][a-zA-Z0-9]+$

  abertura-cabecalhos-agente:
    description: Every operation, except getToken, references the codigoAgente and codigoPerfil headers.
    message: "{{error}}"
    severity: error
    given: $.paths[*][?(@.operationId && @.operationId != 'getToken')]
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          allOf:
            - contains:
                type: object
                required: [name, in]
                properties:
                  name: {const: codigoAgente}
                  in: {const: header}
            - contains:
                type: object
                required: [name, in]
                properties:
                  name: {const: codigoPerfil}
                  in: {const: header}

  abertura-nao-oficial:
    description: The title says "unofficial" and the project metadata does not use the CCEE name.
    message: "{{error}}"
    severity: error
    given: $
    then:
      - field: info.title
        function: pattern
        functionOptions:
          match: unofficial
      - field: info.contact.name
        function: pattern
        functionOptions:
          notMatch: (?i)ccee
      - field: info.contact.url
        function: pattern
        functionOptions:
          notMatch: (?i)ccee
      - field: info.contact.email
        function: pattern
        functionOptions:
          notMatch: (?i)ccee
      - field: info.license.name
        function: pattern
        functionOptions:
          notMatch: (?i)ccee
      - field: info.license.url
        function: pattern
        functionOptions:
          notMatch: (?i)ccee
      - field: externalDocs.url
        function: pattern
        functionOptions:
          notMatch: (?i)ccee
      - field: externalDocs.description
        function: pattern
        functionOptions:
          notMatch: (?i)ccee

  abertura-email-exemplo:
    description: Every example emailUnidadeConsumidora ends in @example.org.
    message: "{{error}}"
    severity: error
    # The same name serves the value in an example (string) and the schema
    # property (object, whose `example` is also checked). So the first step
    # accepts an object and only enforces the suffix on strings.
    given: $..emailUnidadeConsumidora
    then:
      - function: schema
        functionOptions:
          schema:
            anyOf:
              - type: object
              - type: string
                pattern: "@example\\.org$"
      - field: example
        function: pattern
        functionOptions:
          match: "@example\\.org$"
