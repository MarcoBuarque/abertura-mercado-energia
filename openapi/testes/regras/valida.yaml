openapi: 3.0.3
info:
  title: Exemplo mínimo (descrição não oficial)
  version: 0.0.0
  description: Especificação mínima que passa em todas as regras próprias.
  contact:
    name: Projeto independente
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:4010
tags:
  - name: Teste
    description: Operações de teste.
paths:
  /token:
    post:
      operationId: obterToken
      tags: [Teste]
      summary: Obtém o token
      description: Operação que não leva cabeçalhos de agente.
      x-confianca: alta
      x-verificado-em: "2026-10-30"
      responses:
        "200":
          description: Token emitido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
  /itens:
    get:
      operationId: listarItens
      tags: [Teste]
      summary: Lista itens
      description: Operação que leva os cabeçalhos de agente.
      x-confianca: media
      parameters:
        - $ref: "#/components/parameters/CodigoAgente"
        - $ref: "#/components/parameters/CodigoPerfil"
      responses:
        "200":
          description: Lista de itens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  emailUnidadeConsumidora:
                    type: string
                    example: pessoa@example.org
              examples:
                inventado:
                  summary: "Inventado: item de teste"
                  value:
                    emailUnidadeConsumidora: pessoa@example.org
components:
  parameters:
    CodigoAgente:
      name: codigoAgente
      in: header
      required: true
      description: Código do agente.
      schema:
        type: integer
    CodigoPerfil:
      name: codigoPerfil
      in: header
      required: true
      description: Código do perfil.
      schema:
        type: integer
